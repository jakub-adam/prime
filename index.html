<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime</title>
<meta name="description" content="Food, training, body and activity in one place.">
<meta name="theme-color" content="#eef1f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prime">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
  /* Apply the saved theme before first paint so there is no flash. */
  (function () {
    var pref = 'system';
    try { pref = JSON.parse(localStorage.getItem('prime.theme') || '"system"') || 'system'; } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#11171d' : '#eef1f3');
  })();
</script>
</head>
<body>
<div id="root"></div>
<noscript>Prime needs JavaScript.</noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
